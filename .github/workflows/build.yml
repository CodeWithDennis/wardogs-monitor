name: Build

# Every push and pull request: typecheck, test, and build the Windows
# installer and portable exe (downloadable from the run's artifacts).
# Pushing a tag like v0.0.1 (matching package.json) also publishes them as a GitHub release.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build for Windows
    if: "!startsWith(github.ref, 'refs/tags/v')"
    runs-on: windows-latest
    env:
      # No code-signing certificate yet: build unsigned.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build installer and portable exe
        run: npm run dist

      - name: Upload the builds
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: wardogs-monitor-windows
          path: |
            release/*.exe
            release/*.blockmap
          retention-days: 7
          if-no-files-found: error

  release:
    name: Build and publish release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A release tag must match the version in package.json, which the app and installer show.
      - name: Check the tag matches the app version
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($expected)."
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build installer and portable exe
        run: npm run dist

      - name: Publish a release for a version tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.exe --title "$GITHUB_REF_NAME" --generate-notes
