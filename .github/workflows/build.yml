name: Build

# Every push and pull request: typecheck, test, and build the Windows
# installer and portable exe (downloadable from the run's artifacts).
# Pushing a tag like v0.2.0 also publishes them as a GitHub release.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build for Windows
    runs-on: windows-latest
    env:
      # No code-signing certificate yet: build unsigned.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build installer and portable exe
        run: npm run dist

      - name: Upload the builds
        uses: actions/upload-artifact@v4
        with:
          name: wardogs-rcon-windows
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error

      - name: Publish a release for a version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true
