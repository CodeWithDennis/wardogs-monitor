<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self'; connect-src 'self' ws://localhost:5199" />
        <title>Wardogs Monitor</title>
        <!-- Paints the boot screen below in the open theme's colours before anything else runs. -->
        <script src="./boot.js"></script>
        <!--
            The boot screen's styles live here, not in a component, so they are
            there for the very first frame. src/components/BootScreen.vue takes
            over the same markup once the app has mounted.
        -->
        <style>
            :root {
                --boot-bg: #0e1222;
                --boot-text: #ebe6d8;
                --boot-muted: #868ba3;
                --boot-accent: #e8b54e;
                --boot-beat: 1.8s;
            }

            .boot-screen {
                position: fixed;
                inset: 0;
                z-index: 900;
                display: grid;
                place-items: center;
                /* What BrandMark and the wordmark read, set to the boot colours. */
                --text: var(--boot-text);
                --accent: var(--boot-accent);
                background: radial-gradient(60% 55% at 50% 42%, color-mix(in srgb, var(--boot-accent) 4%, var(--boot-bg)), var(--boot-bg) 70%);
                color: var(--boot-text);
                font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
                -webkit-app-region: drag;
                user-select: none;
            }

            .widget-window .boot-screen {
                display: none;
            }

            .boot-center {
                display: flex;
                flex-direction: column;
                align-items: center;
                /* Sits a touch above the middle, where the eye lands first. */
                margin-top: -6vh;
            }

            .boot-screen .brand-mark {
                display: block;
                width: 76px;
                height: 76px;
                color: var(--boot-text);
                animation: boot-beat var(--boot-beat) ease-in-out infinite;
            }

            /* The pulse line on the front tag traces across like a heart monitor. */
            .boot-screen .brand-mark path:last-child {
                stroke-dasharray: 29;
                animation: boot-trace var(--boot-beat) cubic-bezier(0.55, 0, 0.35, 1) infinite;
                filter: drop-shadow(0 0 3px color-mix(in srgb, var(--boot-accent) 55%, transparent));
            }

            .boot-word {
                margin: 22px 0 0;
                font-family: 'Oxanium', 'Segoe UI', sans-serif;
                font-size: 25px;
                font-weight: 800;
                letter-spacing: 0.14em;
                line-height: 1;
                text-transform: uppercase;
                white-space: nowrap;
                /* Letter-spacing trails the last letter; this keeps the word centred. */
                margin-right: -0.14em;
            }

            .boot-word span {
                color: var(--boot-accent);
            }

            .boot-line {
                position: relative;
                width: 176px;
                height: 2px;
                margin-top: 26px;
                overflow: hidden;
                border-radius: 2px;
                background: color-mix(in srgb, var(--boot-text) 11%, transparent);
            }

            .boot-line span {
                position: absolute;
                inset: 0 auto 0 0;
                width: 100%;
                border-radius: inherit;
                background: var(--boot-accent);
                transform-origin: left;
                transition: transform 0.35s ease;
            }

            /* Before there is anything to count, a short sweep back and forth. */
            .boot-line.waiting span {
                width: 34%;
                animation: boot-sweep 1.3s ease-in-out infinite alternate;
            }

            .boot-status {
                min-height: 1.4em;
                margin-top: 13px;
                color: var(--boot-muted);
                font-size: 13px;
                letter-spacing: 0.01em;
                font-variant-numeric: tabular-nums;
            }

            @keyframes boot-trace {
                0% {
                    stroke-dashoffset: 29;
                }
                45%,
                62% {
                    stroke-dashoffset: 0;
                }
                100% {
                    stroke-dashoffset: -29;
                }
            }

            @keyframes boot-beat {
                0%,
                30%,
                60%,
                100% {
                    transform: scale(1);
                }
                45% {
                    transform: scale(1.035);
                }
            }

            @keyframes boot-sweep {
                from {
                    transform: translateX(-100%);
                }
                to {
                    transform: translateX(300%);
                }
            }

            @media (prefers-reduced-motion: reduce) {
                .boot-screen .brand-mark,
                .boot-screen .brand-mark path:last-child,
                .boot-line.waiting span {
                    animation: none;
                }

                .boot-line.waiting span {
                    width: 100%;
                    opacity: 0.35;
                }

                .boot-line span {
                    transition: none;
                }
            }
        </style>
    </head>
    <body>
        <!-- Mirrors BootScreen.vue (and its mark, BrandMark.vue). -->
        <div id="boot" class="boot-screen" aria-hidden="true">
            <div class="boot-center">
                <svg class="brand-mark" viewBox="0 0 48 48" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M24.6 12.89A5.5 5.5 0 0 1 29.37 12.13L38.93 15.05A5.5 5.5 0 0 1 42.58 21.92L37.9 37.22A5.5 5.5 0 0 1 31.3 40.95" stroke="currentColor" stroke-width="3" />
                    <circle cx="32.83" cy="17.89" r="1.3" stroke="currentColor" stroke-width="1.5" />
                    <path d="M16.73 12.94A8.3 8.3 0 0 1 32.79 8.94" stroke="currentColor" stroke-width="2.9" stroke-dasharray="0 1" pathLength="7" />
                    <rect x="6" y="17" width="21" height="27" rx="5.5" stroke="currentColor" stroke-width="3" />
                    <circle cx="16.5" cy="21.5" r="1.3" stroke="currentColor" stroke-width="1.5" />
                    <path d="M10 32h2.5l2-4.5 3 9 2.5-6.5 1.5 2h2" stroke="var(--accent)" stroke-width="3" />
                </svg>
                <div class="boot-word">Wardogs <span>Monitor</span></div>
                <div class="boot-line waiting"><span></span></div>
                <div class="boot-status">Starting…</div>
            </div>
        </div>
        <div id="app"></div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
